<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Berita Baru - Siatama Privat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#F0F7F4',
              100: '#D8ECE2',
              200: '#B5DCB8',
              600: '#2D6A4F',
              700: '#1B4332',
              800: '#143427',
              900: '#0B2219',
            },
            cream: {
              50: '#FCFBF9',
              100: '#FAF9F7',
              200: '#F3EFEA',
              300: '#E7E2DA',
            }
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1;
    }
    body {
      background-color: #ECEAE5;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800 antialiased">

  <!-- Mobile Frame (Max width 430px) -->
  <div class="w-full max-w-[430px] min-h-screen sm:min-h-[900px] sm:max-h-[920px] bg-cream-100 sm:rounded-[36px] shadow-2xl overflow-hidden flex flex-col relative border border-cream-300/60">

    <!-- Top App Bar (Header) -->
    <header class="sticky top-0 z-30 bg-cream-100/95 backdrop-blur-md px-5 pt-4 pb-3 border-b border-cream-200/80 flex items-center justify-between">
      <button type="button" class="w-10 h-10 rounded-full bg-white border border-cream-300 flex items-center justify-center text-slate-700 hover:bg-cream-200 active:scale-95 transition shadow-sm">
        <span class="material-symbols-outlined text-xl">arrow_back</span>
      </button>
      <div class="text-center flex-1 px-2">
        <h1 class="text-base font-bold text-slate-900 tracking-tight">Buat Berita Baru</h1>
        <p class="text-[11px] font-medium text-brand-700">Publikasi Kegiatan Siatama</p>
      </div>
      <div class="w-10 flex justify-end">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-emerald-100"></span>
      </div>
    </header>

    <!-- Scrollable Form Container -->
    <main class="flex-1 overflow-y-auto px-5 py-4 space-y-4 no-scrollbar pb-10">

      <!-- Helper Notice -->
      <div class="bg-brand-50 border border-brand-100 rounded-2xl p-3.5 flex items-start gap-3">
        <span class="material-symbols-outlined text-brand-700 mt-0.5 text-xl flex-shrink-0">campaign</span>
        <div>
          <p class="text-xs font-semibold text-brand-900">Form Publikasi Admin</p>
          <p class="text-[11px] text-brand-700 leading-relaxed">Berita yang dipublikasikan akan langsung muncul di menu Berita (Landing Page & Aplikasi Orang Tua/Siswa).</p>
        </div>
      </div>

      <!-- Bagian 2: Unggah Foto (Cover) -->
      <div class="bg-white rounded-2xl p-4 border border-cream-300 shadow-sm space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
            <span class="material-symbols-outlined text-base text-brand-700">image</span>
            Foto Utama (Cover Artikel)
          </label>
          <span class="text-[10px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">Wajib</span>
        </div>

        <!-- Dashed Upload Container -->
        <label for="cover-upload" class="cursor-pointer border-2 border-dashed border-brand-200 hover:border-brand-600 bg-brand-50/40 hover:bg-brand-50/80 rounded-2xl p-5 flex flex-col items-center justify-center text-center transition-all group">
          <input id="cover-upload" type="file" class="hidden" accept="image/*" />
          
          <div class="w-14 h-14 rounded-2xl bg-white shadow-sm border border-brand-100 flex items-center justify-center text-brand-700 group-hover:scale-105 transition-transform">
            <span class="material-symbols-outlined text-2xl group-hover:text-brand-800">add_photo_alternate</span>
          </div>

          <p class="mt-3 text-xs font-bold text-slate-800 group-hover:text-brand-700 transition-colors">
            Unggah Foto Utama (Maks. 2MB)
          </p>
          <p class="mt-1 text-[11px] text-slate-500">
            Format yang didukung: <span class="font-medium text-slate-700">JPG, PNG, atau WebP</span>
          </p>
          <div class="mt-2.5 inline-flex items-center gap-1 text-[10px] font-semibold text-brand-700 bg-white px-2.5 py-1 rounded-full border border-brand-200">
            <span class="material-symbols-outlined text-[12px]">cloud_upload</span>
            Klik untuk pilih file dari perangkat
          </div>
        </label>
      </div>

      <!-- Bagian 3: Form Input Konten -->
      <div class="bg-white rounded-2xl p-4 border border-cream-300 shadow-sm space-y-3.5">
        
        <!-- Kategori Kegiatan -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-800 flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <span class="material-symbols-outlined text-base text-brand-700">category</span>
              Kategori Kegiatan
            </span>
            <span class="text-[10px] text-slate-400">Pilih salah satu</span>
          </label>
          <div class="relative">
            <select class="w-full bg-cream-50 border border-cream-300 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-700 appearance-none font-medium outline-none transition pr-10">
              <option value="" disabled selected>Pilih Kategori (Contoh: Bakti Sosial, Rekap Bulanan)</option>
              <option value="bakti_sosial">Bakti Sosial & Komunitas</option>
              <option value="rekap_bulanan">Rekap Kegiatan Bulanan</option>
              <option value="edukasi">Tips Belajar & Edukasi</option>
              <option value="prestasi">Prestasi Siswa & Tentor</option>
              <option value="pengumuman">Pengumuman Resmi Lembaga</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
              <span class="material-symbols-outlined text-lg">expand_more</span>
            </div>
          </div>
        </div>

        <!-- Judul Berita -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-800 flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <span class="material-symbols-outlined text-base text-brand-700">title</span>
              Judul Berita
            </span>
            <span class="text-[10px] text-slate-400">Maks. 80 Karakter</span>
          </label>
          <div class="relative">
            <input type="text" placeholder="Masukkan judul kegiatan..." class="w-full bg-cream-50 border border-cream-300 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 rounded-xl px-3.5 py-2.5 text-xs text-slate-800 font-medium placeholder-slate-400 outline-none transition" />
          </div>
        </div>

        <!-- Tanggal Publikasi -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-800 flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <span class="material-symbols-outlined text-base text-brand-700">calendar_month</span>
              Tanggal Publikasi
            </span>
            <span class="text-[10px] text-brand-700 font-medium">Hari ini / Terjadwal</span>
          </label>
          <div class="relative flex items-center">
            <input type="text" value="Senin, 09 Maret 2026" class="w-full bg-cream-50 border border-cream-300 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 rounded-xl pl-3.5 pr-10 py-2.5 text-xs text-slate-800 font-medium outline-none transition" />
            <div class="absolute right-3 flex items-center pointer-events-none text-brand-700">
              <span class="material-symbols-outlined text-lg">calendar_today</span>
            </div>
          </div>
        </div>

        <!-- Isi Konten/Artikel -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-800 flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <span class="material-symbols-outlined text-base text-brand-700">description</span>
              Isi Kegiatan
            </span>
            <span class="text-[10px] text-slate-400">Editor Artikel</span>
          </label>
          
          <!-- Formatting Bar Helper -->
          <div class="flex items-center gap-1 px-2.5 py-1.5 bg-cream-200/70 rounded-t-xl border-t border-x border-cream-300 text-slate-600">
            <button type="button" class="p-1 hover:bg-white rounded text-xs font-bold w-6 h-6 flex items-center justify-center">B</button>
            <button type="button" class="p-1 hover:bg-white rounded text-xs italic font-serif w-6 h-6 flex items-center justify-center">I</button>
            <button type="button" class="p-1 hover:bg-white rounded text-xs underline w-6 h-6 flex items-center justify-center">U</button>
            <span class="h-3 w-px bg-cream-300 mx-1"></span>
            <button type="button" class="p-1 hover:bg-white rounded flex items-center justify-center"><span class="material-symbols-outlined text-[14px]">format_list_bulleted</span></button>
            <button type="button" class="p-1 hover:bg-white rounded flex items-center justify-center"><span class="material-symbols-outlined text-[14px]">link</span></button>
            <span class="ml-auto text-[10px] text-slate-500 font-medium">Tersimpan otomatis</span>
          </div>

          <!-- Textarea -->
          <textarea rows="5" placeholder="Tulis detail kegiatan Siatama di sini... Contoh: Rincian acara, lokasi, partisipasi siswa, dan hasil kegiatan belajar mengajar..." class="w-full bg-cream-50 border border-cream-300 focus:border-brand-700 focus:ring-1 focus:ring-brand-700 rounded-b-xl rounded-t-none px-3.5 py-2.5 text-xs text-slate-800 font-medium placeholder-slate-400 outline-none transition resize-none leading-relaxed"></textarea>
        </div>

      </div>

      <!-- Quick Action: Pratinjau Singkat -->
      <div class="flex items-center justify-between px-1">
        <button type="button" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-brand-700 transition">
          <span class="material-symbols-outlined text-base">visibility</span>
          Pratinjau Tampilan
        </button>
        <span class="text-[11px] text-slate-400 font-medium">Draft Otomatis Tersimpan</span>
      </div>

      <!-- Bagian 4: Tombol Simpan -->
      <div class="pt-2 space-y-2">
        <button type="button" class="w-full bg-brand-700 hover:bg-brand-800 active:scale-[0.98] text-white py-3.5 px-5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-brand-700/20 transition-all">
          <span class="material-symbols-outlined text-lg">publish</span>
          Publikasikan Berita
        </button>
        
        <button type="button" class="w-full bg-transparent hover:bg-cream-200/60 active:scale-[0.98] text-slate-600 py-2.5 px-4 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition">
          Simpan sebagai Draf Saja
        </button>
      </div>

    </main>

  </div>

</body>
</html>
