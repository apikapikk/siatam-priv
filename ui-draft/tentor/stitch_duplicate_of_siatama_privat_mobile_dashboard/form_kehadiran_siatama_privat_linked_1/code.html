<script>
        // Simple JS for button toggle interaction (visual only)
        document.querySelectorAll('.flex.gap-2 button').forEach(button => {
            button.addEventListener('click', function() {
                const parent = this.parentElement;
                parent.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                    btn.classList.add('border-outline', 'text-on-surface-variant');
                });
                this.classList.remove('border-outline', 'text-on-surface-variant');
                this.classList.add('bg-primary', 'text-on-primary', 'border-primary');
            });
        });
    </script>
